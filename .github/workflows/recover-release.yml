# Temporary workflow to recover Python publishing and skipped follow-up jobs for v3.274.0
# Remove after release recovery is complete
name: Recover Python release and follow-up jobs

permissions:
  # To create a PR
  contents: write
  pull-requests: write
  id-token: write

on:
  workflow_dispatch:

concurrency: release

env:
  PULUMI_VERSION: 3.274.0
  GIT_REF: v3.274.0
  PULUMI_TEST_OWNER: "moolumi"
  PYPI_USERNAME: __token__
  ESC_ACTION_ENVIRONMENT: pulumi/github-secrets/pulumi-pulumi
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: GITHUB_TOKEN=PULUMI_BOT_TOKEN,PULUMI_ACCESS_TOKEN=PULUMI_PROD_ACCESS_TOKEN,NODE_AUTH_TOKEN=NPM_TOKEN,NPM_TOKEN,PYPI_PASSWORD=PYPI_API_TOKEN

jobs:
  sdks:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - name: Authenticate with Pulumi Cloud
        id: pulumi-auth
        uses: pulumi/auth-actions@40602447438aac90bca2b87b4528a81120a388b1 # main
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          export-environment-variables: false
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@eec71a90d9989af7ff14bd700b83fc72fae36119 # v4
        with:
          pulumi-access-token: ${{ steps.pulumi-auth.outputs.pulumi-access-token }}
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: v3.274.0
      - name: Set up uv
        if: ${{ matrix.language == 'python' }}
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      - name: Set up Python 3.14.x
        if: ${{ matrix.language == 'python' }}
        uses: actions/setup-python@v6
        with:
          python-version: 3.14.x
      - name: Download release artifacts
        if: ${{ matrix.language != 'go' }}
        run: |
          mkdir -p artifacts
          bash .github/scripts/download-release-artifacts --dir ./artifacts --pattern 'sdk-${{ matrix.language }}-*'
          find artifacts
      - name: Publish Packages
        run: |
          make -C sdk/${{ matrix.language}} publish

  pr:
    # Relies on the Go SDK being published to update pkg
    name: PR
    needs: [sdks]
    uses: ./.github/workflows/release-pr.yml
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      ref: v3.274.0
      version: 3.274.0
      release-notes: ""
      queue-merge: true
    secrets: inherit

  dispatch:
    name: ${{ matrix.job.name }}
    runs-on: ubuntu-latest
    needs: [pr]
    strategy:
      fail-fast: false
      matrix:
        job:
          - name: Update Templates Version
            run-command: pulumictl dispatch -r pulumi/templates -c update-templates "${PULUMI_VERSION}"
          - name: Chocolatey Update
            run-command: pulumictl create choco-deploy "${PULUMI_VERSION}"
          - name: Winget Update
            run-command: pulumictl winget-deploy
          - name: Build Package Docs
            run-command: pulumictl create cli-docs-build "${PULUMI_VERSION}"
          - name: Homebrew
            run-command: pulumictl create homebrew-bump "${PULUMI_VERSION}" "$(git rev-parse HEAD)"
          - name: Docker containers
            run-command: pulumictl dispatch -r pulumi/pulumi-docker-containers -c release-build "${PULUMI_VERSION}"
    steps:
      - name: Authenticate with Pulumi Cloud
        id: pulumi-auth
        uses: pulumi/auth-actions@40602447438aac90bca2b87b4528a81120a388b1 # main
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          export-environment-variables: false
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@eec71a90d9989af7ff14bd700b83fc72fae36119 # v4
        with:
          pulumi-access-token: ${{ steps.pulumi-auth.outputs.pulumi-access-token }}
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: v3.274.0
      - name: Install Pulumictl
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        env:
          GITHUB_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
        with:
          repo: pulumi/pulumictl
          tag: v0.0.50
          cache: enable
      - name: Repository Dispatch
        run: ${{ matrix.job.run-command }}

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: [dispatch]
    uses: ./.github/workflows/release-homebrew-tap.yml
    permissions:
      contents: read
      id-token: write
    with:
      ref: v3.274.0
      version: 3.274.0
      dry-run: false
    secrets: inherit
