env:
  ESC_ACTION_ENVIRONMENT: pulumi/github-secrets/pulumi-pulumi
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false
name: Release

permissions:
  # To create the follow-up PR.
  contents: write
  pull-requests: write
  id-token: write

on:
  release:
    types:
      - released

concurrency: release

jobs:
  info:
    name: gather
    runs-on: ubuntu-latest
    outputs:
      version: "${{ fromJSON(steps.version.outputs.version) }}"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        # Uses release ref (tag)
      - name: Info
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PULUMI_VERSION="${TAG#v}" # remove prefix

          ./.github/scripts/set-output version "${PULUMI_VERSION}"

  release:
    name: release
    needs: [info]
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      version: ${{ needs.info.outputs.version }}
      release-notes: ${{ github.event.release.body }}
      queue-merge: true
      run-dispatch-commands: true
    secrets: inherit

  update-dotnet-automation-api:
    name: update-dotnet-automation-api
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with Pulumi Cloud
        id: pulumi-auth
        uses: pulumi/auth-actions@02d44afe1135b29046b54235b145ce7951ca1fd9 # main
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          export-environment-variables: false
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@ce885ce2ea6bf59194b7b0a3e94a4d3f7bacece0 # v4
        with:
          pulumi-access-token: ${{ steps.pulumi-auth.outputs.pulumi-access-token }}
      - name: Trigger pulumi-dotnet automation API update
        env:
          GITHUB_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
        run: |
          gh api repos/pulumi/pulumi-dotnet/dispatches \
            -f event_type=update-automation-api \
            -f "client_payload[ref]=${{ github.event.release.tag_name }}"
