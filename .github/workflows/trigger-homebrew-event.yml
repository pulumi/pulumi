permissions: write-all # Equivalent to default permissions plus id-token: write
env:
  VERSION: ${{ github.event.client_payload.ref }}
  COMMIT_SHA: ${{ github.event.client_payload.commitSha }}
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-pulumi
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: GITHUB_TOKEN=PULUMI_BOT_TOKEN

on:
  repository_dispatch:
    types:
      - homebrew-bump

jobs:
  homebrew:
    name: Bump Homebrew formula
    runs-on: ubuntu-latest
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@57e332b6dfb0d7edcf6cb813ee9a98b9665f12c2 # v3
      - name: Add Homebrew to the PATH
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "${GITHUB_PATH}"
      - name: Bump Homebrew formula
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_HOMEBREW_TOKEN }}
        run: |
          git config --global user.name "Pulumi Bot"
          git config --global user.email "30351955+pulumi-bot@users.noreply.github.com"
          brew developer on
          brew update-reset
          brew tap homebrew/core --force
          brew bump-formula-pr \
            --no-audit \
            --no-browse \
            --tag="v${VERSION}" \
            --revision="${COMMIT_SHA}" \
            pulumi
