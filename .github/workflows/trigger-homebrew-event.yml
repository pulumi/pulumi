permissions: write-all # Equivalent to default permissions plus id-token: write
env:
  VERSION: ${{ github.event.client_payload.ref }}
  COMMIT_SHA: ${{ github.event.client_payload.commitSha }}
  ESC_ACTION_ENVIRONMENT: pulumi/github-secrets/pulumi-pulumi
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: GITHUB_TOKEN=PULUMI_BOT_TOKEN

on:
  repository_dispatch:
    types:
      - homebrew-bump

jobs:
  homebrew:
    name: Bump Homebrew formula
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with Pulumi Cloud
        id: pulumi-auth
        uses: pulumi/auth-actions@02d44afe1135b29046b54235b145ce7951ca1fd9 # main
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          export-environment-variables: false
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@986bd666a9c58efbb3157521b583d161b101fff7 # v4
        with:
          pulumi-access-token: ${{ steps.pulumi-auth.outputs.pulumi-access-token }}
      - name: Add Homebrew to the PATH
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "${GITHUB_PATH}"
      - name: Bump Homebrew formula
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_HOMEBREW_TOKEN }}
        run: |
          git config --global user.name "Pulumi Bot"
          git config --global user.email "30351955+pulumi-bot@users.noreply.github.com"
          brew developer on
          brew update-reset
          brew tap homebrew/core --force
          brew bump-formula-pr \
            --no-audit \
            --no-browse \
            --tag="v${VERSION}" \
            --revision="${COMMIT_SHA}" \
            pulumi
