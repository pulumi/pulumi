permissions: write-all # Equivalent to default permissions plus id-token: write
env:
  ESC_ACTION_ENVIRONMENT: pulumi/github-secrets/pulumi-pulumi
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false
name: Automatic Rebase
on:
  issue_comment:
    types: [created]
jobs:
  rebase:
    name: Rebase
    runs-on: ubuntu-latest
    if: >-
      contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.comment.author_association) &&
      github.event.issue.pull_request != '' && 
      (
        contains(github.event.comment.body, '/rebase') || 
        contains(github.event.comment.body, '/autosquash')
      )
    steps:
      - name: Authenticate with Pulumi Cloud
        id: pulumi-auth
        uses: pulumi/auth-actions@40602447438aac90bca2b87b4528a81120a388b1 # main
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          export-environment-variables: false
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@eec71a90d9989af7ff14bd700b83fc72fae36119 # v4
        with:
          pulumi-access-token: ${{ steps.pulumi-auth.outputs.pulumi-access-token }}
      - name: Checkout the latest code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          token: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
          fetch-depth: 0 # otherwise, you will fail to push refs to dest repo
      - name: Automatic Rebase
        uses: cirrus-actions/rebase@50007412be906b9cc222db3dfc469f325031f1b2
        with:
          autosquash: ${{ contains(github.event.comment.body, '/autosquash') || contains(github.event.comment.body, '/rebase-autosquash') }}
        env:
          GITHUB_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
