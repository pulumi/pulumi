env:
  ESC_ACTION_ENVIRONMENT: pulumi/github-secrets/pulumi-pulumi
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false
name: Post-Release PR

permissions:
  # To create a PR
  contents: write
  pull-requests: write
  id-token: write

on:
  workflow_call:
    inputs:
      ref:
        required: true
        description: "GitHub ref to use"
        type: string
      version:
        required: true
        description: "Version to produce"
        type: string
      branch_from_ref:
        required: false
        description: "Commit to branch from, if not the tag"
        type: string
      release-notes:
        required: true
        description: "Release notes to publish"
        type: string
      queue-merge:
        required: false
        default: false
        description: "Whether to queue the release for immediate merge"
        type: boolean

jobs:
  version-bump:
    name: version bump
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with Pulumi Cloud
        id: pulumi-auth
        uses: pulumi/auth-actions@40602447438aac90bca2b87b4528a81120a388b1 # main
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          export-environment-variables: false
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@eec71a90d9989af7ff14bd700b83fc72fae36119 # v4
        with:
          pulumi-access-token: ${{ steps.pulumi-auth.outputs.pulumi-access-token }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/retry
        with:
          action: jdx/mise-action@v2
          with: |
            version: 2026.10.3
            experimental: true
            install_args: --locked
      - name: Create PR
        env:
          PULUMI_VERSION: ${{ inputs.version }}
          QUEUE_MERGE: ${{ inputs.queue-merge }}
          GITHUB_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
          REVIEW_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_REVIEW_TOKEN }}
        run: |
          set -euo pipefail

          python3 scripts/changie-pr-lookup.py
          changie batch "${PULUMI_VERSION}"
          changie merge

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -A
          git commit -m "chore: changelog for v${PULUMI_VERSION}"
          CHANGELOG_COMMIT=$(git rev-parse HEAD)

          git switch --create "automation/release-v${PULUMI_VERSION}" origin/master
          git cherry-pick "${CHANGELOG_COMMIT}"

          git push -u origin HEAD

          PR=$(gh pr create --title "Changelog for v${PULUMI_VERSION}" --body "")

          GITHUB_TOKEN="${REVIEW_TOKEN}" gh pr review --approve "${PR}"

          if [ "${QUEUE_MERGE}" = "true" ]; then
            gh pr merge --auto --squash "${PR}"
          fi
