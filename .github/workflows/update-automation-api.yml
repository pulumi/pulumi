name: Update Automation APIs

permissions:
  contents: read
  id-token: write

env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-pulumi
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate automation APIs
    runs-on: ubuntu-latest
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@6cf9520e68354d86f81c455e8d43eabd58f5c9f5 # v1
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          token: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
      - uses: ./.github/actions/retry
        with:
          action: jdx/mise-action@v2
          with: |
            # Pin mise: the latest advertised version, 2026.9.3, has no release assets.
            version: 2026.9.2
            experimental: true
      - name: Regenerate
        run: make generate-automation-apis
      - name: Create or update PR
        id: pr
        env:
          GITHUB_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
        run: |
          set -euo pipefail
          branch=automation/update-automation-api
          git add -A
          if git diff --cached --quiet; then
            echo "Automation APIs are up to date."
            exit 0
          fi
          if git fetch --depth=2 --quiet origin "$branch" 2>/dev/null; then
            mapfile -t paths < <(git show --name-only --format= FETCH_HEAD; git diff --cached --name-only)
            if git diff --quiet FETCH_HEAD -- "${paths[@]}"; then
              echo "The open PR already contains these exact changes."
              exit 0
            fi
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git switch --create "$branch"
          git commit -m "Regenerate automation APIs from the CLI specification"
          git push --force origin HEAD
          # If a PR is already open for this branch, the force-push above refreshed it; reuse its URL.
          existing=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
          if [ -n "$existing" ]; then
            echo "PR already open: ${existing}; refreshed the branch."
            echo "url=${existing}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_url=$(gh pr create --draft \
            --label impact/no-changelog-required \
            --title "Regenerate automation APIs" \
            --body "The CLI specification no longer matches the generated automation APIs. This PR regenerates them from ${GITHUB_SHA}.")
          echo "url=${pr_url}" >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        if: steps.pr.outputs.url != ''
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          payload: |
            channel: "#team-iac-core"
            text: "The `pulumi` automation APIs have drifted from the CLI; a regeneration PR is ready for review: ${{ steps.pr.outputs.url }}"
