component: cli/new
kind: improvement
body: '`pulumi new` now runs a best-effort cloud credentials check, validating and configuring
  the provider, after creating a project from an AWS or Azure template in interactive mode
  and prints an advisory warning when credentials are missing or invalid. Set
  PULUMI_SKIP_NEW_CREDENTIALS_CHECK=true to disable'
time: 2026-08-24T00:00:00Z
