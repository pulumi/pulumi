component: cli/new
kind: improvement
body: '`pulumi new` now runs a best-effort AWS credentials check after creating a project
  from an AWS template in interactive mode and prints an advisory warning when credentials
  are missing or invalid. Set PULUMI_SKIP_NEW_CREDENTIALS_CHECK=true to disable'
