body: Alias the policy API types in `apitype` to the Pulumi Cloud SDK, which renames `ListPolicyIssuesResponse.Issues`/`Total` to `PolicyIssues`/`RowCount`, changes the `PolicyIssue` timestamps to `*time.Time` and `GetPolicyGroupResponse.AgentPoolID` to `*string`, and makes the `CreatePolicyGroupRequest` fields pointers or optional values
