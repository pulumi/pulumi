run: |
  esc env run default/test print-key
  esc env run -i default/test print-key
process:
  commands:
    print-key: |
      echo "key: $KEY"
      echo "password: $PASSWORD, plain: $PLAIN"
environments:
  test-user/default/test:
    values:
      key:
        fn::secret: |
          -----BEGIN TEST KEY-----
          MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC7VJTUt9Us8cKj
          MzEfYyjiWA4R4/M2bS1GB4t7NXp98C3SC6dVMvDuictGeurT8jNbvJZHtCSuYEvu
          -----END TEST KEY-----
      password: {"fn::secret": "hunter2"}
      plain: plaintext
      environmentVariables:
        KEY: ${key}
        PASSWORD: ${password}
        PLAIN: ${plain}

---
> esc env run default/test print-key
key: [secret]
password: [secret], plain: plaintext
> esc env run -i default/test print-key
key: -----BEGIN TEST KEY-----
MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC7VJTUt9Us8cKj
MzEfYyjiWA4R4/M2bS1GB4t7NXp98C3SC6dVMvDuictGeurT8jNbvJZHtCSuYEvu
-----END TEST KEY-----

password: hunter2, plain: plaintext

---
> esc env run default/test print-key
> esc env run -i default/test print-key
