run: |
  esc env default --accept
  esc env default --revoke
  esc env open
error: exit status 1
process:
  fs:
    proj/.esc.yaml: |
      environment: test-user/default/the-env
  cwd: proj
environments:
  test-user/default/the-env:
    values:
      foo: bar

---
