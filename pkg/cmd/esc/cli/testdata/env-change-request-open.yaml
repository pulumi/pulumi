run: |
  esc env init default/test
  esc env open-request default/test --grant-expiration-seconds 1h --access-duration-seconds 30m --reason "Debugging an outage"
  esc env approvals ls
  esc env approvals get test-request-id-12345
  esc env approvals get test-request-id-12345 --output json
  esc env approvals diff test-request-id-12345 || true
  esc env approvals rebase test-request-id-12345 || true
  esc env approvals approve test-request-id-12345 --dry-run
  esc env approvals approve test-request-id-12345 --yes
  esc env approvals apply test-request-id-12345 --yes
  esc env approvals log test-request-id-12345

---
