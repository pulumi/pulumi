run: |
  esc env edit default/test
error: exit status 1
process:
  environ:
    EDITOR: my-editor
  commands:
    my-editor: |
      echo -e "values:\n  foo: baz\n" >$1
environments:
  test-user/default/test:
    gatedActions:
      - update
    revisions:
      - yaml:
          values:
            foo: bar

