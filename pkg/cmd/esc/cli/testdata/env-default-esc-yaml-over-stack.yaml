run: esc env default
process:
  fs:
    work/.esc.yaml: |
      environment: test-user/default/test
    work/Pulumi.dev.yaml: |
      environment:
        - default/other
    work/Pulumi.yaml: |
      name: my-project
      runtime: nodejs
  cwd: work
pulumi:
  selected-stack: dev
environments:
  test-user/default/other:
    values:
      foo: baz
  test-user/default/test:
    values:
      foo: bar

---
> esc env default
environment: test-user/default/test
source: work/.esc.yaml

