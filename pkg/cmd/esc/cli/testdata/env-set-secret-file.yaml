"true"
> esc env set default/test bool-file-string -f=bool.txt --secret --string
> esc env get default/test bool-file-string --value json --show-secrets
"true"
> esc env set default/test num-arg 1234 --secret
> esc env get default/test num-arg --value json --show-secrets
"1234"
> esc env set default/test num-arg-string 1234 --secret --string
> esc env get default/test num-arg-string --value json --show-secrets
