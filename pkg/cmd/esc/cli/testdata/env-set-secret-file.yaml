run: |
  esc env init default/test
  echo 1234 >num.file
  esc env set default/test password -f=num.file --secret
  echo true | esc env set default/test flag -f=- --secret
  esc env set default/test bang --secret '!hunter2'
  esc env get default/test --show-secrets

