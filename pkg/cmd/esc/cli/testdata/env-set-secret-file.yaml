run: |
  esc env init default/test

  # Non-string scalars read from a file used to panic when combined with --secret: the code that
  # re-quotes the value as a string literal read the value from the command-line argument, which
  # doesn't exist when the value comes from -f.
  esc env set default/test num-file -f=num.txt --secret
  esc env get default/test num-file --value json --show-secrets
  esc env set default/test num-file-string -f=num.txt --secret --string
  esc env get default/test num-file-string --value json --show-secrets

  esc env set default/test bool-file -f=bool.txt --secret
  esc env get default/test bool-file --value json --show-secrets
  esc env set default/test bool-file-string -f=bool.txt --secret --string
  esc env get default/test bool-file-string --value json --show-secrets

  # The same scalars passed as a command-line argument instead, for parity.
  esc env set default/test num-arg 1234 --secret
  esc env get default/test num-arg --value json --show-secrets
  esc env set default/test num-arg-string 1234 --secret --string
  esc env get default/test num-arg-string --value json --show-secrets

  esc env set default/test bool-arg true --secret
  esc env get default/test bool-arg --value json --show-secrets
  esc env set default/test bool-arg-string true --secret --string
  esc env get default/test bool-arg-string --value json --show-secrets

  # A secret value that parses as a YAML list or map is rejected up front with a hint to use
  # --string, both when read from a file and when passed as an argument.
  esc env set default/test list-file -f=list.txt --secret || echo OK
  esc env set default/test list-file-string -f=list.txt --secret --string
  esc env get default/test list-file-string --value json --show-secrets

  esc env set default/test map-file -f=map.txt --secret || echo OK
  esc env set default/test map-file-string -f=map.txt --secret --string
  esc env get default/test map-file-string --value json --show-secrets

  esc env set default/test list-arg '[a, b]' --secret || echo OK
  esc env set default/test list-arg-string '[a, b]' --secret --string
  esc env get default/test list-arg-string --value json --show-secrets

  esc env set default/test map-arg 'k: v' --secret || echo OK
  esc env set default/test map-arg-string 'k: v' --secret --string
  esc env get default/test map-arg-string --value json --show-secrets
process:
  fs:
    bool.txt: "true"
    list.txt: '[a, b]'
    map.txt: 'k: v'
    num.txt: "1234"

