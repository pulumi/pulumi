run: |
  esc env set default/test foo draft --draft
  printf '\n' | esc env edit default/test --draft=EXAMPLE
process:
  environ:
    EDITOR: my-editor
  commands:
    my-editor: |
      reopened=
      while IFS= read -r line; do
        case "$line" in
          *"changed after it was read"*) reopened=yes ;;
        esac
      done <$1
      if [ -z "$reopened" ]; then
        esc env set default/test bar concurrent --draft=EXAMPLE
        echo -e "values:\n  foo: baz\n" >$1
      else
        while IFS= read -r line; do echo "| $line"; done <$1
        echo -e "values:\n  foo: baz\n  bar: concurrent\n" >$1
      fi
environments:
  test-user/default/test:
    values:
      foo: bar

