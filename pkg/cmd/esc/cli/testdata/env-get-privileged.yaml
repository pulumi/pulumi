run: |
  esc env get default/dispatch summary
  esc env get default/dispatch summary --privileged
  esc env get default/dispatch --value json
  esc env get default/dispatch --value json --privileged
environments:
  test-user/default/dispatch:
    imports:
      - read:
          excludeIn: privileged
      - write:
          includeIn: privileged
    values:
      summary: ${access}
  test-user/default/read:
    values:
      access: read
  test-user/default/write:
    values:
      access: write
      writeOnlyKey: w

---
