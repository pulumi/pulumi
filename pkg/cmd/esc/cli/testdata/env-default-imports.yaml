run: |
  esc env default --accept
  esc env open
  esc env get --definition
process:
  fs:
    proj/.esc.yaml: |
      environment:
        organization: test-user
        imports:
          - default/the-env
  cwd: proj
environments:
  test-user/default/the-env:
    values:
      foo: bar

---
> esc env default --accept
Accepted default environment configuration at .esc.yaml
> esc env open
{
  "foo": "bar"
}
> esc env get --definition
imports:
  - default/the-env

---
> esc env default --accept
> esc env open
> esc env get --definition
