# The test toolchain, a prerequisite for both CI jobs and development.
# CI treats it as an authority: the toolchain image installs [tools]
# wholesale, [vars] holds the pins CI installs without mise, tool-pin
# resolves both for the host steps, and any change rolls the image tag.
# Extra dev tools live in mise.dev.toml, pulled in when MISE_ENV=dev is
# set (see .envrc.template).

[tools]
go = "1.27"
node = "22"
python = '3.11'
dotnet = "8"
java = "temurin-11"
gradle = "7.6"
uv = "0.11.28"
bun = "1.3.14"
"github:pulumi/goteststats" = "0.0.7"

[vars]
# Pins the tools CI installs without mise to mirror the host steps:
# yarn and pnpm through npm (so the dependency cooldown applies), dlv
# and gotestsum through go install. `mise.dev.toml` references these
# vars so developers can still get the tools from `mise install`.
#
# npm must be 11.17.0 or newer for the dependency-cooldown action.
npm = "^11.17.0"
yarn = "1.22.22"
pnpm = "11"
# Delve's minor version must match the Go minor in CI (see get-job-matrix.py),
# or debugger tests fail with "Version of Delve is too old".
dlv = "1.27.2"
gotestsum = "1.13.0"

[env]
PULUMI_TEST_USE_NPM = "true"

[plugins]
gradle = "https://github.com/rfrancis/asdf-gradle"
